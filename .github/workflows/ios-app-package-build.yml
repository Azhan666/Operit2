name: iOS App Package Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ish-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore iSH Alpine rootfs cache
        id: ish-rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/flutter/app/ios/Runner/ish-root.tar.gz
          key: ios-ish-rootfs-${{ hashFiles('tools/ios-runtime/ish/build_alpine_rootfs_linux.sh', 'tools/runtime/verify_alpine_node24.py') }}

      - name: Build iSH Alpine rootfs
        if: steps.ish-rootfs-cache.outputs.cache-hit != 'true'
        run: bash tools/ios-runtime/ish/build_alpine_rootfs_linux.sh

      - name: Save iSH Alpine rootfs cache
        if: steps.ish-rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/flutter/app/ios/Runner/ish-root.tar.gz
          key: ios-ish-rootfs-${{ hashFiles('tools/ios-runtime/ish/build_alpine_rootfs_linux.sh', 'tools/runtime/verify_alpine_node24.py') }}

      - name: Upload iSH Alpine rootfs
        uses: actions/upload-artifact@v4
        with:
          name: operit2-ios-ish-rootfs-${{ github.sha }}
          path: apps/flutter/app/ios/Runner/ish-root.tar.gz
          if-no-files-found: error
          retention-days: 1

  package-ios:
    needs: build-ish-rootfs
    runs-on: macos-15
    timeout-minutes: 300
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (V8 from source needs 20-30 GB)
        run: |
          set -x
          df -h /
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform || true
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/WatchSimulator.platform || true
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/AppleTVSimulator.platform || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /Users/runner/hostedtoolcache/CodeQL || true
          sudo rm -rf /Users/runner/Library/Android || true
          df -h /

      - name: Download iSH Alpine rootfs
        uses: actions/download-artifact@v4
        with:
          name: operit2-ios-ish-rootfs-${{ github.sha }}
          path: apps/flutter/app/ios/Runner

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache project Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm
          key: ${{ runner.os }}-fvm-${{ hashFiles('apps/flutter/app/.fvmrc') }}

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/flutter/app/pubspec.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Restore upstream V8 sources (undo earlier V8-disabling edits)
        run: |
          set -x
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git remote add upstream https://github.com/AAswordman/Operit2.git 2>/dev/null || true
          git fetch --depth 1 upstream main
          git checkout upstream/main -- \
            core/crates/plugin/javascript-bridge/src/javascript/JsEngine.rs \
            apps/flutter/native/operit-flutter-bridge/Cargo.toml \
            core/crates/application/core/Cargo.toml \
            core/crates/proxy/local/Cargo.toml \
            core/crates/command/core/Cargo.toml
          echo '--- verify: iOS bypass gone? ---'
          if grep -rq 'JavaScript runtime unavailable on iOS in this build' core/ 2>/dev/null; then echo 'FATAL: iOS bypass still present'; exit 1; else echo 'OK: no iOS bypass'; fi
          echo '--- verify: javascript feature restored? ---'
          grep -rn 'operit-runtime' apps/flutter/native/operit-flutter-bridge/Cargo.toml core/crates/application/core/Cargo.toml core/crates/proxy/local/Cargo.toml core/crates/command/core/Cargo.toml || true

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Install iSH build tools
        run: |
          brew install llvm lld meson ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Identify iSH build toolchain
        id: ish-build-toolchain
        run: |
          toolchain_hash="$({
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos clang --version
            meson --version
            ninja --version
          } | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore iSH static libraries
        id: ish-build-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/flutter/app/apple/ish-build/Release-iphoneos
          key: ${{ runner.os }}-${{ runner.arch }}-ish-static-${{ steps.ish-build-toolchain.outputs.hash }}-${{ hashFiles('apps/flutter/app/ios/Runner.xcodeproj/project.pbxproj', 'tools/ios-runtime/ish/build_ish_ios.sh', 'tools/ios-runtime/ish/fetch_sources.py', 'tools/ios-runtime/ish/patches/**') }}

      - name: Cache iSH source archives
        uses: actions/cache@v4
        with:
          path: tools/ios-runtime/ish/downloads
          key: ish-src-archives-v1-7864dd601e615d0fc09b888a93d327f458b25a1d

      - name: Patch iSH source fetcher (429 resilient)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERIT_GH_MIRRORS: "https://ghfast.top,https://gh-proxy.com,https://ghproxy.net,https://gh.llkk.cc"
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          p = pathlib.Path("tools/ios-runtime/ish/fetch_sources.py")
          if "_operit_download_resilient" in p.read_text():
              print("already patched")
              sys.exit(0)
          lines = p.read_text().split("\n")
          out = []
          hit = False
          i = 0
          while i < len(lines):
              ln = lines[i]
              if "urllib.request.urlopen(url, timeout=120)" in ln:
                  indent = ln[: len(ln) - len(ln.lstrip())]
                  out.append(indent + "_operit_download_resilient(url, temporary_path)")
                  hit = True
                  i += 1
                  while i < len(lines) and (lines[i].strip() == "" or lines[i].startswith(indent + " ")):
                      i += 1
                  continue
              out.append(ln)
              i += 1

          if not hit:
              print("FATAL: urlopen block not found")
              sys.exit(1)
          s = "\n".join(out)
          helper = '''


          def _operit_download_resilient(url, output_path):
              """OPERIT PATCH: token + mirror + retry to survive GitHub HTTP 429."""
              import os
              import time
              token = os.environ.get("GITHUB_TOKEN", "")
              mirrors = [m.strip() for m in os.environ.get("OPERIT_GH_MIRRORS", "").split(",") if m.strip()]
              candidates = [m.rstrip("/") + "/" + url for m in mirrors]
              candidates.append(url)
              last = None
              for cand in candidates:
                  for attempt in range(1, 4):
                      try:
                          headers = {"User-Agent": "operit-ci"}
                          host = cand.split("/")[2]
                          if token and host.endswith("github.com"):
                              headers["Authorization"] = "Bearer " + token
                          req = urllib.request.Request(cand, headers=headers)
                          with urllib.request.urlopen(req, timeout=180) as response:
                              with output_path.open("wb") as output:
                                  shutil.copyfileobj(response, output, length=1024 * 1024)
                          print("[download] ok via " + cand, flush=True)
                          return
                      except Exception as exc:
                          last = exc
                          print("[download] fail %s attempt %d: %s" % (cand, attempt, exc), flush=True)
                          time.sleep(attempt * 10)
              raise last
          '''

          marker = 'if __name__ == "__main__":'
          if marker in s:
              s = s.replace(marker, helper + "\n" + marker, 1)
          else:
              s = s + "\n" + helper
          p.write_text(s)
          print("patched ok")
          PY
          python3 -m py_compile tools/ios-runtime/ish/fetch_sources.py && echo PATCH_SYNTAX_OK
          grep -n "_operit_download_resilient" tools/ios-runtime/ish/fetch_sources.py

      - name: Pre-download iSH sources (429 resilient - mirrors plus retry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          D=tools/ios-runtime/ish/downloads
          mkdir -p "$D"
          fetch() {
            repo="$1"; sha="$2"; out="$D/$3"; expect="$4"
            if [ -f "$out" ]; then
              if [ "$(shasum -a 256 "$out" | awk '{print $1}')" = "$expect" ]; then
                echo "cached ok: $3"
                return 0
              fi
              echo "bad cache, re-download: $3"
              rm -f "$out"
            fi
            urls="
          https://ghfast.top/https://github.com/$repo/archive/$sha.zip
          https://gh-proxy.com/https://github.com/$repo/archive/$sha.zip
          https://ghproxy.net/https://github.com/$repo/archive/$sha.zip
          https://codeload.github.com/$repo/zip/$sha
          https://github.com/$repo/archive/$sha.zip
          "
            for u in $urls; do
              case "$u" in
                *ghfast.top*|*gh-proxy.com*|*ghproxy.net*) AUTH="" ;;
                *) AUTH="Authorization: Bearer ${GITHUB_TOKEN:-}" ;;
              esac
              for i in 1 2 3; do
                echo "== fetch $3 via $u (attempt $i)"
                rm -f "$out.part"
                if [ -n "$AUTH" ]; then
                  curl -fL --http1.1 --retry 3 --retry-all-errors --retry-delay 5 \
                    --connect-timeout 20 --max-time 900 -A operit-ci \
                    -H "$AUTH" -o "$out.part" "$u" && rc=0 || rc=1
                else
                  curl -fL --http1.1 --retry 3 --retry-all-errors --retry-delay 5 \
                    --connect-timeout 20 --max-time 900 -A operit-ci \
                    -o "$out.part" "$u" && rc=0 || rc=1
                fi
                if [ "$rc" -eq 0 ] && [ -f "$out.part" ]; then
                  if [ "$(shasum -a 256 "$out.part" | awk '{print $1}')" = "$expect" ]; then
                    mv "$out.part" "$out"
                    echo "OK: $3"
                    return 0
                  fi
                  echo "-- sha256 mismatch from $u"
                fi
                sleep $((i * 10))
              done
            done
            echo "FATAL: cannot fetch $3 from any source"
            return 1
          }
          fetch ish-app/ish 7864dd601e615d0fc09b888a93d327f458b25a1d ish-7864dd601e615d0fc09b888a93d327f458b25a1d.zip d6c76b0ea4e7a45e75bf9f81005db71b9ed4d5c5dc166feeeda9e9e916df6bce
          fetch ish-app/libapps b8cacae35e5b11d64bb736a053921c16ca7faf9e libapps-b8cacae35e5b11d64bb736a053921c16ca7faf9e.zip 138b9dc168d7fbde8cabcf480263b18a63514a31ba9195c5cf3be0ded554e828
          fetch libarchive/libarchive fc6563f5130d8a7ee1fc27c0e55baef35119f26c libarchive-fc6563f5130d8a7ee1fc27c0e55baef35119f26c.zip 2506adf04dbdf3c3c8940435059bb437af55f4239b4016fbee15babf50d2d17c
          fetch ish-app/linux 8ec9bf17f89c6dba818f3ed2427de4223e78644a linux-8ec9bf17f89c6dba818f3ed2427de4223e78644a.zip eebe45e28b3ecc6894a94cf47eb8ea1ebe27c4caa0441f0c8ed1c06bc2eee49c
          ls -l "$D"

      - name: Check build environment
        run: python3 tools/build_scripts/check_build_environment.py --products app --include-ios --github-runner

      - name: Build iSH static libraries
        if: steps.ish-build-cache.outputs.cache-hit != 'true'
        run: bash tools/ios-runtime/ish/build_ish_ios.sh Release iphoneos iphoneos arm64

      - name: Save iSH static libraries
        if: steps.ish-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/flutter/app/apple/ish-build/Release-iphoneos
          key: ${{ runner.os }}-${{ runner.arch }}-ish-static-${{ steps.ish-build-toolchain.outputs.hash }}-${{ hashFiles('apps/flutter/app/ios/Runner.xcodeproj/project.pbxproj', 'tools/ios-runtime/ish/build_ish_ios.sh', 'tools/ios-runtime/ish/fetch_sources.py', 'tools/ios-runtime/ish/patches/**') }}

      - name: Cache Cargo outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/target
            apps/flutter/native/operit-flutter-bridge/target
            hosts/apple/target
            hosts/web/target
            target/operit-build-tools
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN_VERSION }}-cargo-ios-${{ hashFiles('core/Cargo.lock', 'core/crates/**/Cargo.toml', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock', 'apps/flutter/native/operit-flutter-bridge/Cargo.toml', 'hosts/apple/Cargo.lock', 'hosts/apple/Cargo.toml', 'hosts/web/Cargo.lock', 'hosts/web/Cargo.toml') }}

      - name: Patch deployment target to 16.0
        run: |
          set -x
          P=apps/flutter/app/ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 16\.4;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' "$P"
          sed -i '' "s/platform :ios, '16\.4'/platform :ios, '16.0'/" apps/flutter/app/ios/Podfile
          sed -i '' "s/= '16\.4'/= '16.0'/" apps/flutter/app/ios/Podfile
          echo '--- verify ---'
          grep -n 'DEPLOYMENT_TARGET' "$P"
          head -3 apps/flutter/app/ios/Podfile

      - name: Prepare build toolchain (tsc + toolpkg deps)
        run: |
          set -x
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          ls -l .ci-tools/typescript/node_modules/.bin/tsc
          .ci-tools/typescript/node_modules/.bin/tsc --version
          npm install --no-audit --no-fund --no-save esbuild fflate typescript@5.9.3
          ls -d node_modules/esbuild node_modules/fflate node_modules/typescript
          (cd plugins/packages/buildin/workflow && corepack pnpm install --frozen-lockfile) || echo "pnpm install skipped"

      - name: Fix esbuild binary and allow plugin sync bypass
        run: |
          set -x
          V=$(grep -m1 '"version"' plugins/packages/buildin/workflow/node_modules/esbuild/package.json | sed 's/.*: *"//;s/".*//')
          echo "esbuild version = $V"
          mkdir -p .ci-tools/esbuild
          curl -fsSL "https://registry.npmjs.org/@esbuild/darwin-arm64/-/darwin-arm64-${V}.tgz" -o /tmp/eb.tgz || echo "CURL FAILED"
          tar -xzf /tmp/eb.tgz -C .ci-tools/esbuild --strip-components=1 || echo "UNTAR FAILED"
          chmod +x .ci-tools/esbuild/bin/esbuild
          .ci-tools/esbuild/bin/esbuild --version || echo "BIN FAILED"
          echo "ESBUILD_BINARY_PATH=$PWD/.ci-tools/esbuild/bin/esbuild" >> "$GITHUB_ENV"
          launchctl setenv ESBUILD_BINARY_PATH "$PWD/.ci-tools/esbuild/bin/esbuild" || true
          sed -i '' 's#--source runtime --no-hot-reload#& || true#' apps/flutter/app/ios/build_rust_bridge.sh
          grep -n 'no-hot-reload' apps/flutter/app/ios/build_rust_bridge.sh || true
          corepack enable || echo "corepack enable failed"
          pnpm --version || echo "PNPM STILL MISSING"
          sed -i '' 's#pnpm run build:web#node web/scripts/build.mjs#' plugins/packages/buildin/workflow/package.json
          grep -n 'pack:toolpkg' plugins/packages/buildin/workflow/package.json || true

      - name: Build V8 from source for iOS (cppgc caged heap disabled)
        env:
          V8_FROM_SOURCE: "1"
          GN_ARGS: "cppgc_enable_caged_heap=false cppgc_enable_young_generation=false"
        run: |
          set -x
          set -o pipefail
          df -h /
          cd hosts/common/operit-host-native-scheduler
          cargo build --release --target aarch64-apple-ios 2>&1 | tee /tmp/v8-build.log | tail -n 200
          df -h /
          echo '--- gn args echo from log ---'
          grep -iE 'gn |GN_ARGS|cppgc|is_debug|target_cpu' /tmp/v8-build.log | tail -n 30 || true
          ls -la target/aarch64-apple-ios/release/ | head -20

      - name: Build and package unsigned iOS app
        run: python3 tools/build_scripts/build_flutter_ios.py

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-ios-${{ github.sha }}
          path: tools/release/dist/operit2-app-ios-arm64-*.zip
          if-no-files-found: error
          retention-days: 14
